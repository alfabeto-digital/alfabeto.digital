# sops creation rules.
#
# After generating each host's age key (see README.md), fill in the
# public key below and commit this file. The public key is NOT a secret.
#
# To get a host's public key:
#   age-keygen -y /root/.config/sops/age/keys.txt
#
# With this file in place, `sops --encrypt` auto-selects the right key
# without needing to pass --age on the command line.

creation_rules:
  - path_regex: nixos/secrets/secrets-vps\.yaml$
    age: "FILL_VPS_AGE_PUBLIC_KEY"
  - path_regex: nixos/secrets/secrets\.yaml$
    age: "FILL_ALFABETO_DIGITAL_AGE_PUBLIC_KEY"
